# ---------------------------------------------------------------------
#  FAQ shown on the About page
# ---------------------------------------------------------------------
[[faq]]
q = "How does CineMatch decide what to recommend?"
a = "It compares the features of every movie (genre, mood, language, director, cast) and picks the ones most similar to the movie you chose."

[[faq]]
q = "Why didn't I get a movie from a different language?"
a = "Language is one of the features. Turn on 'Ignore language' on the Recommend page to get picks from any language."

[[faq]]
q = "Can I add more movies?"
a = "Yes — the data expert adds a new row to data/movies.csv and the recommender learns it automatically."
